name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build binary
        shell: bash
        run: packaging/build.sh ttm-jira ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          bin="dist/ttm-jira"
          if [[ "${{ matrix.target }}" == windows-* ]]; then bin="$bin.exe"; fi
          uv run --quiet --python 3.12 packaging/smoke_test.py "$bin" 20
      - uses: actions/upload-artifact@v4
        with:
          name: ttm-jira-${{ matrix.target }}
          path: dist/release/*

  bundles:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Pack .mcpb bundles
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p bundles
          mcpb/pack.sh "$version" artifacts bundles
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: bundles/*

  publish:
    needs: [build, bundles]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/ttm-jira-*.tar.gz artifacts/ttm-jira-*.zip \
            artifacts/ttm-jira-*.sha256 \
            artifacts/ttm-jira-*.mcpb \
            install.sh install.ps1 \
            --title "$GITHUB_REF_NAME" --generate-notes
